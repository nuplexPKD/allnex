.container { max-width:500px; margin:auto; background:white; padding:20px;}
h2 { text-align:center; color:#ee4d2d;}

<select id="product"></select>

<input id="quantity" placeholder="Quantity (kg)">

<script>

// 🔑 CONFIG (ANH ĐỔI 2 dòng này)
const supabase = supabase.createClient(
  "https://YOUR_PROJECT.supabase.co",
  "YOUR_PUBLIC_KEY"
);

const EMAIL_API = "https://formspree.io/f/YOUR_ID";

// 📦 PRODUCT LIST (anh paste full 300 SKU vào đây)
const products = [
"066395A01P01 - AQUAGUARD",
"059943A01P01 - CLEAR",
"066180A01P01 - BERMUDA"
];

const dropdown = document.getElementById("product");

// load sản phẩm
function loadProducts(list){
  dropdown.innerHTML="";
  list.forEach(p=>{
    const opt=document.createElement("option");
    opt.text=p;
    opt.value=p;
    dropdown.add(opt);
  });
}

loadProducts(products);

// search giống Shopee
function filterProduct(){
  let kw=document.getElementById("search").value.toLowerCase();
  let filtered=products.filter(p=>p.toLowerCase().includes(kw));
  loadProducts(filtered);
}

async function login(){
  let email = prompt("Enter your email:");
  await supabase.auth.signInWithOtp({ email: email });
  alert("Check email to login");
}
